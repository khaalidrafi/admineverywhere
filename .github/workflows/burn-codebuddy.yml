# burn-codebuddy — deepseek-v4.1-flash@codebuddy exhaust lane (lead-owned).
#
# Owner order 2026-10-31 ("exhaust deepseek-v4.1-flash@codebuddy in what
# it's good at cuz its free offer ends TODAY"): run the free CodeBuddy body
# continuously on real, self-contained repo work from agent-team/BURN-QUEUE.md.
# Outputs are run artifacts; the Lead triages and turns accepted outputs into
# seat dispatches. Invocation mirrors the proven probe in agent-team.yml
# (run 2026-10-23 lane): -p mode, bypassPermissions, model deepseek-v4.1-flash.

name: burn-codebuddy

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Max tasks to consume from BURN-QUEUE.md this run"
        default: "12"
        required: false

permissions:
  contents: read

concurrency:
  group: burn-codebuddy
  cancel-in-progress: false

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install codebuddy body
        run: |
          npm install -g @tencent-ai/codebuddy-code
          codebuddy --version

      - name: Burn queue (one codebuddy run per task line)
        env:
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
          CODEBUDDY_IS_SANDBOX: "1"
          ROUNDS: ${{ github.event.inputs.rounds || '12' }}
        run: |
          set -u
          mkdir -p burn-out
          n=0
          while IFS= read -r task; do
            [ -z "$task" ] && continue
            case "$task" in '#'*) continue ;; esac
            n=$((n + 1))
            [ "$n" -gt "$ROUNDS" ] && break
            echo "=== burn task $n: ${task:0:80} ==="
            for attempt in 1 2; do
              timeout 1500 codebuddy -p "$task

              Work in this repository (read-only analysis unless the task says
              otherwise). Write your full work product to burn-out/task-$n.md and
              also print it. Cite file:line evidence for every claim." \
                -y --permission-mode bypassPermissions --max-turns 25 \
                --model deepseek-v4.1-flash < /dev/null \
                > "burn-out/task-$n.stdout.log" 2>&1
              rc=$?
              # a real work product or a CLI transcript with content counts
              if [ "$rc" = 0 ] && [ -s "burn-out/task-$n.stdout.log" ] \
                 && ! grep -q "ETIMEDOUT\|network request timeout" "burn-out/task-$n.stdout.log"; then
                break
              fi
              echo "task $n attempt $attempt rc=$rc — retrying in 20s" >> burn-out/FAILURES.txt
              sleep 20
            done
            grep -q "ETIMEDOUT\|network request timeout" "burn-out/task-$n.stdout.log" 2>/dev/null \
              && echo "task $n network-blocked after retries" >> burn-out/FAILURES.txt || true
          done < agent-team/BURN-QUEUE.md
          echo "burned $n tasks"

      - name: Hand off results to a branch (quota-proof)
        if: always()
        run: |
          git config user.name "agent-team-ci"
          git config user.email "agent-team-ci@users.noreply.github.com"
          git checkout -B "ai/burn-results-${{ github.run_id }}--c_codebuddy"
          git add -A burn-out
          if git diff --cached --quiet; then
            echo "no burn-out to hand off"
            exit 0
          fi
          git commit -m "burn-results: run ${{ github.run_id }}

          Co-authored-by: agent-team-ci <agent-team-ci@users.noreply.github.com>"
          git push --force origin "ai/burn-results-${{ github.run_id }}--c_codebuddy"

      - name: Upload burn artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: codebuddy-burn-${{ github.run_id }}
          path: burn-out/
          retention-days: 30
