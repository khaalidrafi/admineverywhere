[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admineverywhere"
version = "0.1.7"
description = "Branded, extensible AI admin dashboard: Django plugin that themes a Tauri/Svelte thin client from one brand.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khalid Rafi" }]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# The in-process assistant (Owner decision 2026-11-05; slave-agent specs/014):
# the panel imports the slave-agent core as a library through
# admineverywhere.agent_embed. The branch is the GENERATED branded tree
# (ai/slave-agent) — the artifact users install per FORK.org.
agent = ["slave-agent @ git+https://github.com/khaalidrafi/slave-agent.git@ai/slave-agent"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
